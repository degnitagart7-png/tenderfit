# /etc/nginx/conf.d/tenderfit-local-api.conf — внутренний адрес API таблиц для supabase-js.
# supabase-js ходит на ${SUPABASE_URL}/rest/v1/<таблица>; PostgREST отвечает с корня — nginx срезает префикс.
# Слушает только 127.0.0.1: снаружи API недоступен.
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    client_max_body_size 64m;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
