# nginx для tender-fit.ru — приложение работает на этом же сервере.
#
# Куда ставить:
#   sudo cp deploy/nginx-tenderfit.conf /etc/nginx/sites-available/tenderfit-proxy
#   sudo ln -sf /etc/nginx/sites-available/tenderfit-proxy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Строки «managed by Certbot» дописывает сам certbot при выпуске сертификата.
# Если сертификата ещё нет, сначала:
#   sudo certbot --nginx -d tender-fit.ru
#
# История: раньше здесь стоял прокси на Vercel — домен с российским адресом
# отдавал запрос за рубеж и обратно. Теперь Next.js слушает 127.0.0.1:3000 на
# этой же машине (служба tenderfit-app), лишнего прыжка нет.
#
# Откат на Vercel: положить на место файл tenderfit-proxy.vercel и
# перезагрузить nginx.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Запрос не на наш домен закрываем без ответа: отвечать чужому имени
    # сертификатом tender-fit.ru незачем.
    return 444;
}

server {
    server_name tender-fit.ru;

    # Документы закупок доходят до 64 МБ.
    client_max_body_size 64m;

    # Статика сборки неизменяема: имя файла содержит хеш содержимого, поэтому
    # её можно держать в браузере год. Отдаётся с диска из архива сборок
    # (static-archive пополняет deploy-app.sh до и после сборки): пока идёт
    # сборка, .next/static пуст, и раньше страницы в это время падали. Чего в
    # архиве нет — спрашиваем приложение.
    #
    # Заголовок кеша ставится только на найденный файл, БЕЗ always: до 12.10.2026
    # здесь стоял always, и ответ 404 во время сборки браузер запоминал на год —
    # вкладка ломалась насовсем (ChunkLoadError), перезагрузка не помогала.
    location /_next/static/ {
        root /opt/tenderfit-ai/static-archive;
        try_files $uri @next_static;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @next_static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Upgrade/Connection нужны для потоковых ответов Next.js.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        # Кнопка поиска по Контур.Закупкам держит запрос до минуты.
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tender-fit.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tender-fit.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = tender-fit.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name tender-fit.ru;
    return 404; # managed by Certbot
}
